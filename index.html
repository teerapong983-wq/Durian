window.__showErr=function(msg){var v=document.getElementById('view');if(!v)return;
  v.innerHTML='<div class="panel" style="border-color:var(--bad)"><h2 style="color:var(--bad)">แอปเปิดไม่สำเร็จ</h2><p style="margin:0">ส่งข้อความด้านล่างนี้ให้ผู้พัฒนา</p><pre style="white-space:pre-wrap;font-size:.8rem;background:var(--sunk);padding:10px;border-radius:8px;margin:0">'+String(msg).replace(/[&<]/g,function(c){return c==='&'?'&amp;':'&lt;'})+'</pre><button class="btn" onclick="location.reload()">โหลดใหม่</button></div>';};

async function shrink(file){
  try{const bmp=await createImageBitmap(file,{imageOrientation:'from-image'});const s=Math.min(1,1600/Math.max(bmp.width,bmp.height));
    const c=document.createElement('canvas');c.width=Math.round(bmp.width*s);c.height=Math.round(bmp.height*s);c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
    const b=await new Promise(r=>c.toBlob(r,'image/jpeg',0.82));return b||file;}catch(e){return file}
}

const API={url:'',key:''};
try{Object.assign(API,JSON.parse(localStorage.getItem('durian.api')||'{}'))}catch(e){}
const run=async(fn,...args)=>{
  if(!API.url||!API.key) throw new Error('NotConfigured');
  let r;
  try{ r=await fetch(API.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({key:API.key,fn,args})}); }
  catch(e){ throw new Error('NetworkError: '+(e&&e.message||e)); }
  let j; try{ j=await r.json(); }catch(e){ throw new Error('คำตอบจากเซิร์ฟเวอร์ไม่ใช่ JSON (HTTP '+r.status+') ตรวจว่าทำให้ใช้งานได้เป็น "ทุกคน" และ URL ลงท้ายด้วย /exec'); }
  if(!j.ok) throw new Error(j.error||'ผิดพลาด');
  return j.result;
};
const isNet=e=>/network|connection|HTTP 0|offline|failed to fetch|timed? ?out|load failed/i.test(String((e&&e.message)||e));
let Q=[];try{Q=JSON.parse(localStorage.getItem('durian.q')||'[]')}catch(e){}
const saveQ=()=>{try{localStorage.setItem('durian.q',JSON.stringify(Q))}catch(e){}};
const cache=()=>{try{const c={};COLS.forEach(k=>c[k]=S[k]);c.gap=S.gap;c.settings=S.settings;c.env={appUrl:ENV.appUrl,sheetUrl:ENV.sheetUrl};localStorage.setItem('durian.cache',JSON.stringify(c))}catch(e){}};
function enqueue(fn,args){Q.push({fn,args});saveQ();cache();updSync();flush();}
let flushing=false;
async function flush(){
  if(flushing||!Q.length)return; flushing=true;
  while(Q.length){ const op=Q[0];
    try{ await run(op.fn,...op.args); Q.shift(); saveQ(); }
    catch(e){ if(isNet(e))break; Q.shift(); saveQ(); toast('บันทึกลง Sheet ไม่สำเร็จ: '+((e&&e.message)||e)); } }
  flushing=false; updSync();
}
function updSync(){const el=$('#sync');if(!el)return;el.hidden=!Q.length;el.textContent=`รอส่งข้อมูลขึ้น Google Sheet ${Q.length} รายการ · จะส่งให้อัตโนมัติเมื่อมีสัญญาณ`;}
window.addEventListener('online',flush); setInterval(()=>{if(Q.length)flush()},20000);
const newId=col=>col.slice(0,2)+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
function upsert(col,r){const i=S[col].findIndex(x=>x.id===r.id);if(i>=0)S[col][i]=r;else S[col].push(r)}
async function save(col,rec,keepEx){
  const data={...rec}; if(!keepEx) delete data.example; data.updatedAt=Date.now(); if(!data.id) data.id=newId(col);
  Object.keys(data).forEach(k=>{if(data[k]===undefined)delete data[k]});
  upsert(col,data); render(); enqueue('saveRecord',[col,data]);
  toast(navigator.onLine===false?'บันทึกในเครื่องแล้ว จะส่งขึ้น Sheet เมื่อมีสัญญาณ':'บันทึกแล้ว');
  return data;
}
async function patch(col,id,fields){ const r=byId(col,id); if(!r)return; await save(col,{...r,...fields},true); }
async function remove(col,id){ S[col]=S[col].filter(x=>x.id!==id); render(); enqueue('removeRecord',[col,id]); toast('ลบแล้ว'); }
async function saveGap(g){ g={...g}; delete g.updatedAt; S.gap=g; render(); enqueue('saveConfig',['gap',g]); toast('บันทึกแล้ว'); }
async function saveSettings(s){ S.settings=s; render(); enqueue('saveConfig',['settings',s]); toast('บันทึกการตั้งค่าแล้ว'); }
function apply(d){
  if(d.env)Object.assign(ENV,d.env);
  COLS.forEach(c=>S[c]=Array.isArray(d[c])?d[c]:[]);
  S.gap=d.gap||{};
  S.settings={orchardName:(d.settings&&d.settings.orchardName)||'สวนทุเรียน',days:{...DEF_DAYS,...((d.settings&&d.settings.days)||{})}};
  Q.forEach(op=>{ const [a1,a2]=op.args;
    if(op.fn==='saveRecord')upsert(a1,a2); else if(op.fn==='removeRecord')S[a1]=S[a1].filter(x=>x.id!==a2);
    else if(op.fn==='saveConfig'){ if(a1==='gap')S.gap=a2; else S.settings={...S.settings,...a2}; } });
}
let lastLoad=0;
async function load(manual){
  try{ const d=await run('getAll'); apply(d); mode='ready'; lastLoad=Date.now(); cache(); if(manual)toast('โหลดข้อมูลล่าสุดจาก Sheet แล้ว'); }
  catch(e){ if(/NotConfigured|คีย์ไม่ถูกต้อง/.test(String(e&&e.message))){mode='setup';render();return} window.__lastErr=String((e&&e.message)||e); if(mode==='loading'){mode='error';console.error(e);} toast(isNet(e)?'ไม่มีสัญญาณ ใช้ข้อมูลที่บันทึกในเครื่องไปก่อน':'โหลดข้อมูลไม่สำเร็จ: '+((e&&e.message)||e)); }
  render(); flush();
}

function openForm(col,id,preset,back){
  const F=FORMS[col]; const rec=F.single?{...S.gap}:id?{...byId(col,id)}:{...(preset||{})};
  if(!id) F.fields.forEach(f=>{ if(rec[f.k]==null&&f.def!=null) rec[f.k]=typeof f.def==='function'?f.def():f.def; });
  if(col==='trees'&&!id&&!rec.plotId&&UI.plot) rec.plotId=UI.plot;
  if((col==='trees'||col==='blooms'||col==='pests')&&!S.plots.length){ toast('เพิ่มแปลงก่อน แล้วค่อยเพิ่มรายการนี้'); return openForm('plots'); }
  if(col==='treelogs'&&!S.trees.length){ toast('เพิ่มต้นทุเรียนก่อน'); return openForm('trees'); }
  const photos=[...(rec.photos||[])], added=[], removed=[]; let busy=0;
  const fld=f=>{
    const v=rec[f.k]??''; const idA=`f_${col}_${f.k}`;
    let inp;
    if(f.t==='photos'){ inp=`<div class="thumbs" id="thumbs"></div>${assets?`<div class="toolbar"><label class="btn" for="${idA}">ถ่ายรูป / เลือกรูป</label><input id="${idA}" type="file" accept="image/*" multiple hidden></div>`:`<span class="hint">${mode==='db'?'เฉพาะเจ้าของสวนที่อัปโหลดรูปได้':'อัปโหลดรูปได้เมื่อเปิดหน้านี้ใน claude.ai'}</span>`}`; }
    else if(f.t==='select'){ inp=`<select id="${idA}" name="${f.k}" ${f.req?'required':''}>${f.opts(rec).map(([a,b])=>`<option value="${esc(a)}" ${String(a)===String(v)?'selected':''}>${esc(b)}</option>`).join('')}</select>`; }
    else if(f.t==='textarea') inp=`<textarea id="${idA}" name="${f.k}">${esc(v)}</textarea>`;
    else inp=`<input id="${idA}" name="${f.k}" type="${f.t}" ${f.step?`step="${f.step}"`:''} ${f.t==='number'?'inputmode="decimal"':''} value="${esc(v)}" ${f.ph?`placeholder="${esc(f.ph)}"`:''} ${f.req?'required':''}>`;
    return `<div class="fld ${f.full?'full':''}" data-k="${f.k}"><label ${f.t==='photos'?'':`for="${idA}"`}>${esc(f.l)}${f.req?' *':''}</label>${f.hint?`<span class="hint">${esc(f.hint)}</span>`:''}${inp}</div>`;
  };
  $('#modal').innerHTML=`<div class="scrim" id="scrim"><div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(F.title)}">
    <div class="top"><h2>${F.single?'':id?'แก้ไข':'เพิ่ม'}${esc(F.title)}</h2><button class="iconbtn" data-close aria-label="ปิด">✕</button></div>
    <form id="frm" novalidate>${F.fields.map(fld).join('')}
      <div class="actions"><div>${id?`<button type="button" class="btn danger" id="del">ลบ</button>`:''}</div>
      <div class="toolbar"><button type="button" class="btn" data-close>ยกเลิก</button><button class="btn pri" type="submit" id="saveBtn">บันทึก</button></div></div>
    </form></div></div>`;
  const frm=$('#frm');
  const drawThumbs=()=>{const t=$('#thumbs');if(!t)return;
    t.innerHTML=photos.map((p,i)=>`<div class="thumb"><img src="${blob(p)}" alt="รูปที่ ${i+1}"><button type="button" class="x" data-rm="${i}" aria-label="เอารูปออก">✕</button></div>`).join('')+(busy?Array(busy).fill('<div class="thumb busy">กำลังอัปโหลด…</div>').join(''):'');
    $('#saveBtn').disabled=busy>0;
    t.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{const [p]=photos.splice(+b.dataset.rm,1);removed.push(p);drawThumbs()});
  };
  drawThumbs();
  const fi=frm.querySelector('input[type=file]');
  if(fi) fi.onchange=async()=>{
    const files=[...fi.files]; fi.value=''; busy+=files.length; drawThumbs();
    for(const f of files){
      try{const b=await shrink(f);const du=await toDataURL(b);const pid=await run('uploadPhoto',du,'durian-'+Date.now()+'.jpg');photos.push(pid);added.push(pid);}
      catch(e){toast(isNet(e)?'อัปโหลดรูปต้องมีสัญญาณอินเทอร์เน็ต':'อัปโหลดรูปไม่สำเร็จ: '+((e&&e.message)||e))}
      busy--; drawThumbs();
    }
  };
  const fe=k=>frm.elements.namedItem(k);
  const read=()=>{const o={};F.fields.forEach(f=>{if(f.t==='photos'){o[f.k]=photos.slice();return}const el=fe(f.k);let x=el.value;if(f.t==='number')x=x===''?null:Number(x);o[f.k]=x===''?null:x});return o};
  const set=(k,val)=>{const el=fe(k);if(el){el.value=val;}};
  const refresh=(changed)=>{
    const v=read();
    F.fields.forEach(f=>{
      if(f.dep&&f.dep===changed){const el=fe(f.k);const cur=el.value;el.innerHTML=f.opts(v).map(([a,b])=>`<option value="${esc(a)}">${esc(b)}</option>`).join('');if([...el.options].some(o=>o.value===cur))el.value=cur;}
      if(f.show) frm.querySelector(`[data-k="${f.k}"]`).hidden=!f.show(v);
    });
  };
  refresh();
  frm.addEventListener('change',e=>{const k=e.target.name;if(!k)return;if(F.hook)F.hook(k,read(),set);refresh(k)});
  frm.addEventListener('input',e=>{const k=e.target.name;if(F.hook&&(k==='qty'||k==='unitPrice'))F.hook(k,read(),set)});
  let saved=false;
  modalCleanup=()=>{ if(!saved) trash(added); };
  modalBack=back||null;
  frm.addEventListener('submit',async e=>{
    e.preventDefault(); if(busy)return;
    const v=read(); const miss=F.fields.find(f=>f.req&&(v[f.k]==null||v[f.k]===''));
    if(miss){toast('กรุณากรอก '+miss.l);fe(miss.k)?.focus();return}
    F.fields.forEach(f=>{if(f.show&&!f.show(v))v[f.k]=null});
    try{ if(F.single) await saveGap({...S.gap,...v}); else await save(col,{...rec,...v,id});
      saved=true; trash(removed); closeModal(); }catch(e){}
  });
  const del=$('#del'); if(del) del.addEventListener('click',async()=>{
    if(del.dataset.armed){await remove(col,id);saved=true;trash([...(rec.photos||[]),...added]);closeModal()} else {del.dataset.armed=1;del.textContent='กดอีกครั้งเพื่อยืนยันลบ';}
  });
  setTimeout(()=>frm.querySelector('input:not([type=file]),select')?.focus(),30);
}
function closeModal(){
  if(modalCleanup){try{modalCleanup()}catch(e){}modalCleanup=null}
  $('#modal').innerHTML='';
  const b=modalBack; modalBack=null; if(b) setTimeout(b,120);
}

function growthChart(L){
  const P=L.filter(l=>l.canopy!=null||l.height!=null);
  if(P.length<2) return `<p class="note" style="margin:0">บันทึกขนาดอย่างน้อย 2 ครั้งเพื่อดูกราฟการเติบโต</p>`;
  const W=600,H=200,l=36,r=14,t=14,b=28;
  const t0=pd(P[0].date).getTime(),t1=pd(P[P.length-1].date).getTime()||t0+1;
  const mx=Math.max(...P.map(p=>Math.max(+p.canopy||0,+p.height||0)));
  const step=mx>12?4:mx>6?2:1, top=Math.ceil(mx*1.1/step)*step||step;
  const X=d=>l+(pd(d).getTime()-t0)/((t1-t0)||1)*(W-l-r), Y=v=>t+(1-v/top)*(H-t-b);
  let g='';for(let v=0;v<=top;v+=step)g+=`<line x1="${l}" x2="${W-r}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${l-6}" y="${Y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${v}</text>`;
  const line=(k,c)=>{const Q=P.filter(p=>p[k]!=null&&p[k]!=='');if(!Q.length)return '';
    return `<polyline fill="none" stroke="${c}" stroke-width="2.5" stroke-linejoin="round" points="${Q.map(p=>X(p.date)+','+Y(+p[k])).join(' ')}"/>`+Q.map((p,i)=>`<circle cx="${X(p.date)}" cy="${Y(+p[k])}" r="${i===Q.length-1?4.5:3}" fill="${c}"/>`).join('')+
    `<text x="${X(Q[Q.length-1].date)}" y="${Y(+Q[Q.length-1][k])-9}" text-anchor="end" font-size="11" fill="${c}" font-weight="600">${(+Q[Q.length-1][k]).toFixed(1)} ม.</text>`};
  const xl=[P[0],P[P.length-1]].map((p,i)=>`<text x="${X(p.date)}" y="${H-8}" text-anchor="${i?'end':'start'}" font-size="11" fill="var(--muted)">${fmtD(p.date)}</text>`).join('');
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="กราฟความกว้างทรงพุ่มและความสูง">${g}${line('canopy','var(--accent)')}${line('height','var(--gold)')}${xl}</svg></div>
   <div class="legend"><span><i style="background:var(--accent)"></i>ความกว้างทรงพุ่ม (ม.)</span><span><i style="background:var(--gold)"></i>ความสูง (ม.)</span></div>`;
}
let LB=[],LBi=0;
function openLB(list,i){LB=list;LBi=i;drawLB()}
function drawLB(){const p=LB[LBi];if(!p){$('#lb').innerHTML='';return}
  $('#lb').innerHTML=`<div class="lb" id="lbbg" role="dialog" aria-label="ดูรูป"><img src="${blob(p.id)}" alt="${esc(p.cap)}"><div class="bar2">${LB.length>1?`<button data-lb="-1" aria-label="รูปก่อน">‹</button>`:''}<span>${esc(p.cap)} · ${LBi+1}/${LB.length}</span>${LB.length>1?`<button data-lb="1" aria-label="รูปถัดไป">›</button>`:''}<button data-lb="0">ปิด</button></div></div>`;
  $('#lb').querySelectorAll('[data-lb]').forEach(b=>b.onclick=e=>{e.stopPropagation();const d=+b.dataset.lb;if(!d){LB=[];drawLB();return}LBi=(LBi+d+LB.length)%LB.length;drawLB()});
  $('#lbbg').onclick=e=>{if(e.target.id==='lbbg'){LB=[];drawLB()}};
}

function taskRow(x,showDate=true){

  return `<div class="row" data-act="edit" data-col="tasks" data-id="${x.id}">

function bloomLabel(b){const c=treeCode(b.treeId);return c?`ต้น ${esc(c)}`:`ชุดดอก ${esc(plotName(b.plotId))}`}
function bloomRow(b){
  const t=today(),due=dueOf(b),total=daysFor(bVariety(b)),el=b.bloomDate?diff(b.bloomDate,t):0;
  const pct=b.status==='done'?100:Math.max(0,Math.min(100,el/total*100));
  const left=due?diff(t,due):null;
  let r;
  const pc=phiConflict(b);
  if(b.status==='done') r=`<span class="pill p-ok">เก็บแล้ว</span><div class="num">${kg((+b.kgA||0)+(+b.kgB||0)+(+b.kgC||0))} กก.</div>${b.lot?`<small class="note num">ล็อต ${esc(b.lot)}</small>`:''}${pc?`<div style="color:var(--bad);font-size:.78rem">เก็บก่อนพ้นระยะเว้นสาร</div>`:''}`;
  else if(b.status==='lost') r=`<span class="pill p-mute">ร่วง/เสียหาย</span>`;
  else r=`<div class="num" style="font-size:1.1rem;${left<=0?'color:var(--bad)':left<=14?'color:var(--warn)':''}">${left>0?'อีก '+left+' วัน':left===0?'ครบวันนี้':'เลย '+(-left)+' วัน'}</div><small class="note">ตัดประมาณ ${fmtD(due)}</small>`;
  return `<div class="bloom" data-act="edit" data-col="blooms" data-id="${b.id}">
   <div style="min-width:0"><div class="t" style="font-weight:500">${bloomLabel(b)} · ${esc(bVariety(b))}${exTag(b)}</div>
   <div class="s note">${esc(plotName(b.plotId))} · ดอกบาน ${fmtD(b.bloomDate)} · อายุผล ${b.status==='done'&&b.harvestDate?diff(b.bloomDate,b.harvestDate):el} วัน${b.fruitCount?` · ${b.fruitCount} ผล`:''}</div></div>
   <div style="text-align:right">${r}</div>
   <div class="bar ${b.status==='done'?'done':''}" role="img" aria-label="ความคืบหน้า ${Math.round(pct)}%"><i style="width:${pct}%"></i></div></div>`;
}

function vCal(){
  const y=UI.calY,m=UI.calM,t=today();
  const first=new Date(y,m,1), start=new Date(y,m,1-first.getDay());
  const ev={};const push=(d,c)=>{(ev[d]=ev[d]||[]).push(c)};
  S.tasks.forEach(x=>push(x.date,`var(${(TASKT[x.type]||TASKT.check)[1]})`));
  S.blooms.filter(b=>(b.status||'dev')==='dev'&&b.bloomDate).forEach(b=>push(dueOf(b),'var(--gold)'));
  S.pests.filter(p=>p.status!=='closed'&&p.followUp).forEach(p=>push(p.followUp,'var(--bad)'));
  let cells='';for(let i=0;i<42;i++){const d=new Date(start);d.setDate(start.getDate()+i);const s=iso(d);
    if(i===35&&d.getMonth()!==m)break;
    cells+=`<button class="cell ${d.getMonth()!==m?'out':''} ${s===t?'today':''} ${s===UI.sel?'sel':''}" data-act="day" data-d="${s}" aria-label="${fmtD(s)}"><span class="d">${d.getDate()}</span><span class="dots">${(ev[s]||[]).slice(0,6).map(c=>`<i style="background:${c}"></i>`).join('')}</span></button>`}
  const mk=`${y}-${z(m+1)}`;

function gapChecks(D){
  const g=S.gap, out=[];
  const add=(st,t,d,act)=>out.push({st,t,d,act});
  const go=(v,l)=>`<button class="btn sm" data-act="tab" data-v="${v}">${l}</button>`;
  const fm=(f,l)=>`<button class="btn sm" data-act="gapform" data-f="${f}">${l}</button>`;
  add(g.farmer&&g.address?'ok':'bad','ข้อมูลเกษตรกรและที่ตั้งแปลง',g.farmer?esc(g.farmer):'ยังไม่ได้กรอก',fm('gap','กรอกข้อมูล'));
  add(g.water&&g.waterTest?'ok':'warn','แหล่งน้ำและผลวิเคราะห์น้ำ',g.water?esc(g.water)+(g.waterTest?' · วิเคราะห์ '+fmtD(g.waterTest):' · ยังไม่มีวันที่วิเคราะห์น้ำ'):'ยังไม่ระบุแหล่งน้ำ',fm('gap','แก้ไข'));
  add(g.landHistory&&g.risk?'ok':'warn','ประวัติพื้นที่และการประเมินความเสี่ยง',g.landHistory?'มีข้อมูลแล้ว':'ยังไม่ได้กรอก',fm('gap','แก้ไข'));
  const sm=D.spray.filter(t=>!t.product||!t.ai||!t.rate||!t.operator||t.phi==null).length;
  add(!D.spray.length?'warn':sm?'warn':'ok','บันทึกการใช้วัตถุอันตราย',`${D.spray.length} ครั้งที่ทำแล้ว${sm?` · ขาดข้อมูล ${sm} รายการ (ชื่อสาร สารสำคัญ อัตรา ผู้ปฏิบัติ หรือระยะเว้น)`:''}`,go('cal','ไปปฏิทิน'));
  const bn=D.spray.filter(isBanned);
  add(bn.length?'bad':'ok','ไม่ใช้สารที่ห้ามใช้',bn.length?`พบ ${bn.length} รายการ: ${bn.map(t=>esc(t.product||t.ai)).join(', ')}`:'ไม่พบพาราควอตหรือคลอร์ไพริฟอสในบันทึก','');
  const pc=D.harvest.filter(phiConflict);
  add(pc.length?'bad':'ok','เก็บเกี่ยวหลังพ้นระยะเว้นของสาร',pc.length?`${pc.length} ล็อตเก็บก่อนพ้นระยะเว้น: ${pc.map(b=>esc(b.lot||fmtD(b.harvestDate))).join(', ')}`:`ตรวจแล้ว ${D.harvest.length} ล็อต`,pc.length?go('harvest','ดูการเก็บเกี่ยว'):'');
  const fm2=D.fert.filter(t=>!t.product||!t.rate||!t.operator).length;
  add(!D.fert.length?'warn':fm2?'warn':'ok','บันทึกการใช้ปุ๋ย',`${D.fert.length} ครั้ง${fm2?` · ขาดข้อมูล ${fm2} รายการ`:''}`,go('cal','ไปปฏิทิน'));
  const hm=D.harvest.filter(b=>!b.lot||!b.buyer).length;
  add(!D.harvest.length?'warn':hm?'warn':'ok','การเก็บเกี่ยวตามสอบได้ (ล็อตและผู้ซื้อ)',D.harvest.length?`${D.harvest.length} ล็อต${hm?` · ขาดรหัสล็อตหรือผู้ซื้อ ${hm} รายการ`:''}`:'ยังไม่มีการเก็บเกี่ยวในช่วงนี้',go('harvest','ไปหน้า ดอก-ผล'));
  add(S.trainings.length?'ok':'warn','การฝึกอบรมผู้ปฏิบัติงาน',`${S.trainings.length} รายการ`,`<button class="btn sm" data-act="add" data-col="trainings">+ เพิ่ม</button>`);
  const done=GAPCHK.filter((_,i)=>g['c'+i]).length, fx=GAPCHK.filter((_,i)=>g['c'+i]==='fix').length;
  add(done<8?'warn':fx?'warn':'ok','ประเมินตนเองตามข้อกำหนด 8 ข้อ',`ประเมินแล้ว ${done}/8${fx?` · ต้องปรับปรุง ${fx} ข้อ`:''}${g.reviewDate?' · '+fmtD(g.reviewDate):''}`,fm('gapcheck','ประเมิน'));
  return out;
}

function dashData(y){
  const ys=String(y);
  const fy=finYear(y);
  const inc=sum(fy.filter(f=>f.kind==='in'),f=>f.amount), out=sum(fy.filter(f=>f.kind!=='in'),f=>f.amount);
  const har=S.blooms.filter(b=>b.status==='done'&&(b.harvestDate||'').startsWith(ys));
  const kgT=sum(har,kgOf), kgA=sum(har,b=>b.kgA);
  const sale=fy.filter(f=>f.kind==='in'&&f.cat==='ขายทุเรียน'&&/กก|kg/i.test(f.unit||'')&&+f.qty>0);
  const price=sum(sale,f=>f.qty)?sum(sale,f=>f.amount)/sum(sale,f=>f.qty):null;
  const mIn=Array(12).fill(0),mOut=Array(12).fill(0),mA=Array(12).fill(0),mB=Array(12).fill(0),mC=Array(12).fill(0);
  fy.forEach(f=>{const m=+f.date.slice(5,7)-1;(f.kind==='in'?mIn:mOut)[m]+=+f.amount||0});
  har.forEach(b=>{const m=+b.harvestDate.slice(5,7)-1;mA[m]+=+b.kgA||0;mB[m]+=+b.kgB||0;mC[m]+=+b.kgC||0});
  let run_=0;const cum=mIn.map((v,i)=>run_+=v-mOut[i]);
  const cats=EXP.map(c=>[c,sum(fy.filter(f=>f.kind!=='in'&&f.cat===c),f=>f.amount)]).filter(x=>x[1]).sort((a,b)=>b[1]-a[1]);
  const pests={};S.pests.filter(p=>(p.date||'').startsWith(ys)).forEach(p=>pests[p.problem]=(pests[p.problem]||0)+1);
  return {fy,inc,out,har,kgT,kgA,price,mIn,mOut,mA,mB,mC,cum,cats,pests:Object.entries(pests).sort((a,b)=>b[1]-a[1]).slice(0,8)};
}

  <section class="panel"><header><h2>ผลผลิตและต้นทุนแยกแปลง ปี ${BE(y)}</h2></header>
   <div class="tblwrap"><table class="dt"><thead><tr><th>แปลง</th><th>ไร่</th><th>ต้น</th><th>ผลผลิต (กก.)</th><th>กก./ไร่</th><th>เกรด A</th><th>ต้นทุนระบุแปลง (บาท)</th></tr></thead>
   <tbody>${plotRows||'<tr><td colspan="7" class="note">ยังไม่มีแปลง</td></tr>'}${shared?`<tr><td>ส่วนกลาง / ทุกแปลง</td><td></td><td></td><td></td><td></td><td></td><td class="num">${baht(shared)}</td></tr>`:''}</tbody></table></div></section>
  <section class="panel"><header><h2>ถึงวันตัดใน 60 วัน</h2><button class="btn sm" data-act="tab" data-v="harvest">ดอก-ผลทั้งหมด</button></header>
   <div class="list">${soon.length?soon.map(bloomRow).join(''):'<div class="empty">ไม่มีชุดผลที่ถึงวันตัดใน 60 วัน</div>'}</div></section>`;
}
function drawCharts(){
  if(!window.Chart)return;
  const cs=getComputedStyle(document.documentElement), tk=n=>cs.getPropertyValue(n).trim();
  Chart.defaults.font.family=tk('--f-body')||'sans-serif'; Chart.defaults.color=tk('--muted'); Chart.defaults.borderColor=tk('--line');
  const D=dashData(UI.dy), num=v=>Number(v).toLocaleString('th-TH',{maximumFractionDigits:1});
  const base=(extra={})=>Object.assign({responsive:true,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},
    plugins:{legend:{position:'bottom',labels:{boxWidth:10,boxHeight:10}},tooltip:{callbacks:{label:c=>`${c.dataset.label?c.dataset.label+': ':''}${num(c.parsed.y??c.parsed.x)}`}}},
    scales:{x:{grid:{display:false}},y:{beginAtZero:true,ticks:{callback:v=>num(v)}}}},extra);
  const mk=(id,cfg)=>{const el=document.getElementById(id);if(el)CH.push(new Chart(el,cfg))};
  const empty=(id,msg)=>{const el=document.getElementById(id);if(el)el.parentElement.innerHTML=`<div class="empty" style="display:grid;place-items:center;height:100%">${msg}</div>`};
  if(D.fy.length) mk('c_money',{type:'bar',data:{labels:MTH,datasets:[
    {label:'รายรับ',data:D.mIn,backgroundColor:tk('--ok'),borderRadius:3},
    {label:'รายจ่าย',data:D.mOut,backgroundColor:tk('--bad'),borderRadius:3},
    {label:'กำไรสะสม',data:D.cum,type:'line',borderColor:tk('--gold'),backgroundColor:tk('--gold'),pointRadius:2,tension:.25}]},options:base()});
  else empty('c_money','ยังไม่มีรายการบัญชีในปีนี้');
  if(D.kgT) mk('c_yield',{type:'bar',data:{labels:MTH,datasets:[
    {label:'เกรด A',data:D.mA,backgroundColor:tk('--ok')},{label:'เกรด B',data:D.mB,backgroundColor:tk('--gold')},{label:'ตกเกรด',data:D.mC,backgroundColor:tk('--muted')}]},
    options:base({scales:{x:{stacked:true,grid:{display:false}},y:{stacked:true,beginAtZero:true,title:{display:true,text:'กก.'}}}})});
  else empty('c_yield','ยังไม่มีการเก็บเกี่ยวในปีนี้');
  if(D.cats.length) mk('c_cost',{type:'bar',data:{labels:D.cats.map(c=>c[0]),datasets:[{label:'บาท',data:D.cats.map(c=>c[1]),backgroundColor:tk('--accent'),borderRadius:3}]},
    options:base({indexAxis:'y',plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>num(c.parsed.x)+' บาท'}}},scales:{x:{beginAtZero:true,ticks:{callback:v=>num(v)}},y:{grid:{display:false}}}})});
  else empty('c_cost','ยังไม่มีรายจ่ายในปีนี้');
  if(S.plots.length&&S.trees.length) mk('c_health',{type:'bar',data:{labels:S.plots.map(p=>p.name),datasets:Object.entries(HEALTH).map(([k,v])=>({label:v[0],data:S.plots.map(p=>S.trees.filter(t=>t.plotId===p.id&&(t.health||'ok')===k).length),backgroundColor:tk(v[2].slice(4,-1))}))},
    options:base({indexAxis:'y',scales:{x:{stacked:true,beginAtZero:true,ticks:{precision:0}},y:{stacked:true,grid:{display:false}}}})});
  else empty('c_health','ยังไม่มีต้นในทะเบียน');
  const logs=S.treelogs.filter(l=>l.canopy!=null&&l.canopy!==''&&l.date);
  if(logs.length){
    const months=[...new Set(logs.map(l=>l.date.slice(0,7)))].sort();
    const pal=[tk('--accent'),tk('--gold'),tk('--info'),tk('--t-spray'),tk('--t-prune'),tk('--bad')];
    const ds=S.plots.map((p,i)=>{const ids=new Set(S.trees.filter(t=>t.plotId===p.id).map(t=>t.id));
      const data=months.map(m=>{const L=logs.filter(l=>ids.has(l.treeId)&&l.date.startsWith(m));return L.length?Math.round(sum(L,l=>l.canopy)/L.length*10)/10:null});
      return {label:p.name,data,borderColor:pal[i%pal.length],backgroundColor:pal[i%pal.length],spanGaps:true,tension:.25,pointRadius:3};}).filter(d=>d.data.some(v=>v!=null));
    mk('c_growth',{type:'line',data:{labels:months.map(m=>MTH[+m.slice(5)-1]+' '+String(BE(+m.slice(0,4))).slice(2)),datasets:ds},options:base()});
  } else empty('c_growth','ยังไม่มีการวัดทรงพุ่ม');
  if(D.pests.length) mk('c_pest',{type:'bar',data:{labels:D.pests.map(p=>p[0].replace(/ \(.*\)/,'')),datasets:[{label:'ครั้ง',data:D.pests.map(p=>p[1]),backgroundColor:tk('--bad'),borderRadius:3}]},
    options:base({indexAxis:'y',plugins:{legend:{display:false}},scales:{x:{beginAtZero:true,ticks:{precision:0}},y:{grid:{display:false}}}})});
  else empty('c_pest','ไม่พบปัญหาในปีนี้');
}
function vMore(){
  return header('เมนู')+`<div class="menu">${TABS.filter(t=>!BOTTOM.includes(t[0])).map(([k,l,i])=>`<button class="mitem" data-act="tab" data-v="${k}">${svg(i)}<span>${l}</span></button>`).join('')}
   <button class="mitem" data-act="settings">${svg('gear')}<span>ตั้งค่า</span></button>
   <a class="mitem" href="${ENV.sheetUrl}" target="_blank" rel="noopener">${svg('sheet')}<span>เปิด Google Sheet</span></a></div>
  <section class="panel"><h2>ติดตั้งเป็นแอปบนมือถือ</h2><div class="toolbar" id="installBox" hidden><button class="btn pri" id="installBtn">ติดตั้งแอป</button></div>
   <p style="margin:0" class="note">Android (Chrome): แตะเมนู ⋮ แล้วเลือก "เพิ่มลงในหน้าจอหลัก"<br>iPhone (Safari): แตะปุ่มแชร์ แล้วเลือก "เพิ่มไปยังหน้าจอโฮม"</p>
   <div class="toolbar"><button class="btn sm" id="resetApi">เปลี่ยน URL / คีย์การเชื่อมต่อ</button></div>
   <p style="margin:0" class="note">ถ้าสัญญาณหลุดระหว่างบันทึก ข้อมูลจะเก็บไว้ในเครื่องและส่งขึ้น Sheet ให้เองเมื่อกลับมามีสัญญาณ ส่วนการอัปโหลดรูปต้องมีสัญญาณ</p></section>`;
}


function vSetup(){
  return `<div class="setup"><div class="brand"><small>ตั้งค่าครั้งแรก</small><h1>เชื่อมต่อกับ Google Sheet</h1></div>
  <section class="panel"><p style="margin:0">เปิด Google Sheet ของสวน → เมนู <b>สมุดสวน → แสดงลิงก์และคีย์แอป</b> แล้วคัดลอกมาใส่ด้านล่าง</p>
   <form id="setupF" style="display:flex;flex-direction:column;gap:12px">
    <div class="fld"><label for="s_url">URL ของเว็บแอป</label><input id="s_url" placeholder="https://script.google.com/macros/s/…/exec" value="${esc(API.url)}" autocomplete="off" inputmode="url"></div>
    <div class="fld"><label for="s_key">คีย์แอป</label><input id="s_key" placeholder="คีย์ 24 ตัวอักษร" value="${esc(API.key)}" autocomplete="off"></div>
    <div class="toolbar"><button class="btn pri" id="s_go">เชื่อมต่อ</button></div>
    <p class="note" id="s_msg" style="margin:0">${window.__lastErr?esc(window.__lastErr):''}</p></form></section>
  <p class="note">ข้อมูลทั้งหมดเก็บใน Google Sheet ของคุณ แอปนี้แค่อ่านและบันทึกผ่านคีย์ที่ตั้งไว้ ถ้าคีย์หลุด ให้สร้างคีย์ใหม่จากเมนูใน Sheet</p></div>`;
}
function bindSetup(){
  const f=$('#setupF'); if(!f)return;
  f.onsubmit=async e=>{e.preventDefault();
    const url=$('#s_url').value.trim().replace(/\/(dev|exec)?\/?$/,m=>m.includes('dev')?'/exec':'/exec'), key=$('#s_key').value.trim();
    if(!/^https:\/\/script\.google\.com\/.+\/exec$/.test(url)){$('#s_msg').textContent='URL ต้องเป็นลิงก์เว็บแอปของ Apps Script ที่ลงท้ายด้วย /exec';return}
    if(!key){$('#s_msg').textContent='กรุณาใส่คีย์แอป';return}
    $('#s_go').disabled=true;$('#s_msg').textContent='กำลังทดสอบการเชื่อมต่อ…';
    API.url=url;API.key=key;
    try{ await run('ping'); try{localStorage.setItem('durian.api',JSON.stringify(API))}catch(e){} window.__lastErr=''; mode='loading'; render(); load(); }
    catch(err){ $('#s_go').disabled=false; $('#s_msg').textContent='เชื่อมต่อไม่สำเร็จ: '+String(err&&err.message||err); API.url='';API.key=''; }
  };
}
function resetApi(){ try{localStorage.removeItem('durian.api');localStorage.removeItem('durian.cache');localStorage.removeItem('durian.q')}catch(e){} API.url='';API.key='';Q=[];window.__lastErr='';mode='setup';render(); }
const VIEWS={home:vHome,dash:vDash,trees:vTrees,cal:vCal,harvest:vHarvest,pest:vPest,money:vMoney,gap:vGap,more:vMore};
function navHTML(side){
  const b=(k,l,i,cur)=>`<button class="tab" data-act="tab" data-v="${k}" aria-current="${cur}">${svg(i)}<span>${l}</span></button>`;
  if(side) return `<div class="logo">สมุดสวนทุเรียน</div>`+TABS.map(([k,l,i])=>b(k,l,i,UI.view===k)).join('')+`<a class="tab" href="${ENV.sheetUrl}" target="_blank" rel="noopener" style="text-decoration:none">${svg('sheet')}<span>Google Sheet</span></a>`;
  return TABS.filter(t=>BOTTOM.includes(t[0])).map(([k,l,i])=>b(k,l,i,UI.view===k)).join('')+b('more','เมนู','more',!BOTTOM.includes(UI.view));
}
function render(){
  $('#side').innerHTML=navHTML(true);$('#bottom').innerHTML=navHTML(false);
  if(PRINT){ if(mode==='loading'){$('#view').innerHTML='<div class="skel">กำลังโหลดข้อมูล…</div>';return}
    $('#view').innerHTML=`<div class="pbar"><span>แบบบันทึก GAP ทุเรียน · ${esc(S.gap.farmer||S.settings.orchardName||'')} · ${fmtLong(UI.gFrom)} – ${fmtLong(UI.gTo)} · กระดาษ A4 แนวนอน</span><button data-act="print">พิมพ์</button></div><div class="doc">${gapDoc()}</div>`; return; }
  if(mode==='setup'){ $('#fab').hidden=true; $('#view').innerHTML=vSetup(); bindSetup(); return; }
  if(mode==='loading'){return}
  if(!VIEWS[UI.view])UI.view='home';
  let html=VIEWS[UI.view]();
  html=`<div class="sync" id="sync" hidden></div>`+(mode==='error'?`<div class="banner"><span>เชื่อมต่อ Google Sheet ไม่ได้: ${esc(window.__lastErr||'')}</span><button class="btn sm" data-act="reload">ลองใหม่</button></div>`:'')+html;
  CH.forEach(c=>{try{c.destroy()}catch(e){}});CH=[];
  $('#view').innerHTML=html; updSync();
  $('#fab').hidden=!FAB_COL[UI.view];
  if(UI.view==='dash') drawCharts();
  const cx=$('#clearEx');if(cx)cx.onclick=async()=>{if(!cx.dataset.armed){cx.dataset.armed=1;cx.textContent='กดอีกครั้งเพื่อยืนยัน';return}
    cx.disabled=true;cx.textContent='กำลังลบ…';
    try{const n=await run('removeExamples');COLS.forEach(c=>S[c]=S[c].filter(r=>!r.example));cache();render();toast(`ลบข้อมูลตัวอย่างแล้ว ${n} แถว`);}
    catch(e){cx.disabled=false;cx.textContent='ลบข้อมูลตัวอย่างทั้งหมด';toast(isNet(e)?'ต้องมีสัญญาณอินเทอร์เน็ตเพื่อลบข้อมูลตัวอย่าง':'ลบไม่สำเร็จ: '+((e&&e.message)||e))}};
  const fp=$('#fPlot');if(fp)fp.onchange=e=>{UI.plot=e.target.value;render()};
  const fh=$('#fHealth');if(fh)fh.onchange=e=>{UI.health=e.target.value;render()};
  const fyr=$('#fYear');if(fyr)fyr.onchange=e=>{UI.year=+e.target.value;render()};
  const ra=$('#resetApi');if(ra)ra.onclick=()=>{if(!ra.dataset.armed){ra.dataset.armed=1;ra.textContent='กดอีกครั้งเพื่อยืนยัน (ข้อมูลใน Sheet ไม่หาย)';return}resetApi()};
  const gf=$('#gFrom'),gt=$('#gTo');
  if(gf)gf.onchange=e=>{if(e.target.value){UI.gFrom=e.target.value;render()}};
  if(gt)gt.onchange=e=>{if(e.target.value){UI.gTo=e.target.value;render()}};
  document.querySelectorAll('[data-sec]').forEach(cb=>cb.onchange=e=>{const k=e.target.dataset.sec;e.target.checked?UI.gSec.add(k):UI.gSec.delete(k);render()});
  const gb=$('#gBlank');if(gb)gb.onchange=e=>{UI.blank=e.target.checked;render()};
}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  if(e.target.closest('[data-close]')||e.target.id==='scrim'){closeModal();return}
  const el=e.target.closest('[data-act]');if(!el)return;
  const a=el.dataset.act;
  if(a==='toggle'){e.stopPropagation();const x=byId('tasks',el.dataset.id);if(x)patch('tasks',x.id,{status:x.status==='done'?'todo':'done'});return}
  if(a==='tab'){UI.view=el.dataset.v;try{localStorage.setItem('durian.view',UI.view)}catch(_){};render();window.scrollTo(0,0);return}
  if(a==='edit'){openForm(el.dataset.col,el.dataset.id);return}
  if(a==='tree'){openTree(el.dataset.id);return}
  if(a==='add'){openForm(el.dataset.col);return}
  if(a==='settings'){openSettings();return}
  if(a==='bf'){UI.bloomF=el.dataset.v;render();return}
  if(a==='pf'){UI.pestF=el.dataset.v;render();return}
  if(a==='day'){UI.sel=el.dataset.d&&UI.sel!==el.dataset.d?el.dataset.d:null;render();return}
  if(a==='cal'){const d=+el.dataset.d;if(!d){const n=new Date();UI.calY=n.getFullYear();UI.calM=n.getMonth();UI.sel=today()}else{const n=new Date(UI.calY,UI.calM+d,1);UI.calY=n.getFullYear();UI.calM=n.getMonth();UI.sel=null}render();return}
  if(a==='gapform'){openForm(el.dataset.f);return}
  if(a==='reload'){load(true);return}
  if(a==='dy'){UI.dy=+el.dataset.v;render();return}
  if(a==='grange'){UI.gFrom=el.dataset.y+'-01-01';UI.gTo=el.dataset.y+'-12-31';render();return}
  if(a==='print'){window.print();return}
});
document.addEventListener('keydown',e=>{if(e.key!=='Escape')return;if(LB.length){LB=[];drawLB();return}closeModal()});
$('#fab').onclick=()=>openForm(FAB_COL[UI.view]);

/* ---------- boot ---------- */
{const st=document.createElement('style');st.textContent=DOC_CSS;document.head.appendChild(st);}
const getLoc=()=>Promise.resolve({parameter:Object.fromEntries(new URLSearchParams(location.search))});
(async()=>{
  const loc=await getLoc();
  if(loc&&loc.parameter){ENV.params=loc.parameter;ENV.page=loc.parameter.page||'';}
  if(!API.url||!API.key){mode='setup';render();return}
  PRINT=ENV.page==='print';
  if(PRINT){ const p=ENV.params||{}; if(p.from)UI.gFrom=p.from; if(p.to)UI.gTo=p.to; if(p.sec)UI.gSec=new Set(String(p.sec).split(',').filter(Boolean)); UI.blank=p.blank==='1'; document.body.classList.add('printmode'); }
  try{const c=JSON.parse(localStorage.getItem('durian.cache')||'null'); if(c&&!PRINT){apply(c);mode='cached';}}catch(e){}
  render();
  load();
})();
setTimeout(()=>{if(mode==='loading'&&API.url){$('#view').innerHTML='<div class="panel"><h2>ยังโหลดข้อมูลจาก Google Sheet ไม่เสร็จ</h2><p class="note" style="margin:0">ครั้งแรกระบบจะสร้างแท็บและข้อมูลตัวอย่าง อาจใช้เวลาถึง 30 วินาที</p><div class="toolbar"><button class="btn" data-act="reload">ลองโหลดอีกครั้ง</button></div></div>'}},25000);

window.__appReady=true;
if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})});}
let deferredInstall=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstall=e;const b=$('#installBox');if(b)b.hidden=false;});
document.addEventListener('click',e=>{if(e.target.id!=='installBtn'||!deferredInstall)return;deferredInstall.prompt();deferredInstall.userChoice.finally(()=>{deferredInstall=null;const b=$('#installBox');if(b)b.hidden=true});});
const _render=render; render=function(){_render();const b=$('#installBox');if(b&&deferredInstall)b.hidden=false;};
})();
</script>
</body>
